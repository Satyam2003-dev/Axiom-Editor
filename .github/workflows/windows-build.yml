name: Multi-Platform Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: axiom-build-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build React UI
        run: npm run buildreact
      - name: Build Windows x64 application
        run: npm run gulp vscode-win32-x64
      - name: Add updater and build user installer
        run: |
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup
      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath "artifacts\Axiom-Editor-windows-x64-portable.zip" -CompressionLevel Optimal
          $setup = Get-ChildItem ".build\win32-x64\user-setup" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "Windows installer was not produced." }
          Copy-Item $setup.FullName "artifacts\Axiom-Editor-windows-x64-user-setup.exe"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Editor-windows-x64
          path: artifacts/*
          if-no-files-found: error
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $product = Get-Content product.json -Raw | ConvertFrom-Json
          $expected = "v$($product.axiomVersion)"
          if ("${{ github.ref_name }}" -ne $expected) { throw "Tag must be $expected to match product.json." }

  server-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3
      - name: Install dependencies
        run: npm ci
      - name: Build React UI
        run: npm run buildreact
      - name: Build Linux x64 remote server
        run: npm run gulp vscode-reh-linux-x64
      - name: Package remote server
        run: |
          mkdir -p artifacts
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          tar -czf "artifacts/axiom-reh-linux-x64-${version}.tar.gz" -C ../vscode-reh-linux-x64 .
      - name: Upload remote server artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Editor-server-linux-x64
          path: artifacts/*
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libnss3-dev libgtk-3-dev libxss-dev libasound2-dev python-is-python3 rpm
      - name: Install dependencies
        run: npm ci
      - name: Build React UI
        run: npm run buildreact
      - name: Build Linux x64 application
        run: npm run gulp vscode-linux-x64
      - name: Package Linux artifacts
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/Axiom-Editor-linux-x64.tar.gz" -C ../VSCode-linux-x64 .
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Editor-linux-x64
          path: artifacts/*
          if-no-files-found: error
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "JSON.parse(require('fs').readFileSync('product.json','utf8')).axiomVersion")"
          if [ "${{ github.ref_name }}" != "$expected" ]; then echo "Tag must be $expected to match product.json."; exit 1; fi

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build React UI
        run: npm run buildreact
      - name: Build macOS app
        run: npm run gulp vscode-darwin-${{ matrix.arch }}
      - name: Package macOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "../VSCode-darwin-${{ matrix.arch }}/Axiom Editor.app" "artifacts/Axiom-Editor-macos-${{ matrix.arch }}.zip"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Editor-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "JSON.parse(require('fs').readFileSync('product.json','utf8')).axiomVersion")"
          if [ "${{ github.ref_name }}" != "$expected" ]; then echo "Tag must be $expected to match product.json."; exit 1; fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-x64, linux-x64, server-linux-x64, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Axiom-Editor-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --verify-tag --title "Axiom Editor ${{ github.ref_name }}"
